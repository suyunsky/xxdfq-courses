# xxdfq-courses Nginx配置 - 简化版（开发环境）
# 前端：Vue开发服务器（8080端口）
# 后端：FastAPI Python服务（8000端口）
# 参考tilink.conf配置结构

server {
    listen 80;
    server_name xxdfq.local localhost 127.0.0.1;
    
    # 访问日志
    access_log /var/log/nginx/xxdfq-access.log;
    error_log /var/log/nginx/xxdfq-error.log;
    
    # 通用代理头
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # ============================================
    # 1. 前端Vue开发服务器代理（8080端口）
    # ============================================
    location / {
        proxy_pass http://localhost:8080;
        
        # WebSocket支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 缓存控制
        proxy_set_header Cache-Control "no-cache";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲区设置
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # ============================================
    # 2. 后端API代理（8000端口）
    # ============================================
    location /api/ {
        proxy_pass http://localhost:8000;
        
        # CORS配置 - 允许前端来源
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, Cookie, Set-Cookie" always;
        add_header Access-Control-Expose-Headers "Set-Cookie, Content-Disposition" always;
        
        # 处理OPTIONS预检请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "$http_origin";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, Cookie, Set-Cookie";
            add_header Access-Control-Expose-Headers "Set-Cookie, Content-Disposition";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        
        # Cookie传递
        proxy_cookie_path / "/; SameSite=Lax; HttpOnly";
        proxy_cookie_domain localhost $host;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲区设置
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # ============================================
    # 3. 腾讯云点播API代理
    # ============================================
    location /vod/ {
        proxy_pass http://localhost:8000/vod/;
        
        # 相同的CORS和代理配置
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # ============================================
    # 4. 健康检查端点
    # ============================================
    location /health {
        access_log off;
        return 200 "xxdfq-courses Nginx is healthy\n";
        add_header Content-Type text/plain;
    }
    
    location /api/health {
        proxy_pass http://localhost:8000/api/health;
        access_log off;
    }
    
    # ============================================
    # 5. 错误页面
    # ============================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    # ============================================
    # 6. 安全配置
    # ============================================
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问敏感文件
    location ~* \.(log|sql|bak|conf|ini|env|pyc|pyo)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
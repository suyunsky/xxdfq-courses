# xxdfq-courses Nginx配置 - B方案（开发环境）
# 前端：Vue开发服务器（8080端口）
# 后端：FastAPI Python服务（8000端口）
# 参考tilink.conf配置结构

# 事件模块配置
events {
    worker_connections 1024;
}

# HTTP模块配置
http {
    # 基础MIME类型
    include       mime.types;
    default_type  application/octet-stream;
    
    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    # 访问日志
    access_log /var/log/nginx/xxdfq-access.log main;
    error_log /var/log/nginx/xxdfq-error.log warn;
    
    # 性能优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # 缓存设置
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # 安全头（全局）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # xxdfq-courses服务器配置
    server {
        listen 80;
        server_name xxdfq.local localhost 127.0.0.1;
        
        # 通用代理头
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ============================================
        # 1. 前端Vue开发服务器代理（8080端口）
        # ============================================
        location / {
            proxy_pass http://localhost:8080;
            
            # WebSocket支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 缓存控制
            proxy_set_header Cache-Control "no-cache";
            
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲区设置
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
        
        # ============================================
        # 2. 后端API代理（8000端口）
        # ============================================
        location /api/ {
            proxy_pass http://localhost:8000;
            
            # CORS配置 - 允许前端来源
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, Cookie, Set-Cookie" always;
            add_header Access-Control-Expose-Headers "Set-Cookie, Content-Disposition" always;
            
            # 处理OPTIONS预检请求
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "$http_origin";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, Cookie, Set-Cookie";
                add_header Access-Control-Expose-Headers "Set-Cookie, Content-Disposition";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain charset=UTF-8';
                add_header Content-Length 0;
                return 204;
            }
            
            # Cookie传递
            proxy_cookie_path / "/; SameSite=Lax; HttpOnly";
            proxy_cookie_domain localhost $host;
            
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲区设置
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
        
        # ============================================
        # 3. 腾讯云点播API代理
        # ============================================
        location /vod/ {
            proxy_pass http://localhost:8000/vod/;
            
            # 相同的CORS和代理配置
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;
            
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # ============================================
        # 4. 健康检查端点
        # ============================================
        location /health {
            access_log off;
            return 200 "xxdfq-courses Nginx is healthy\n";
            add_header Content-Type text/plain;
        }
        
        location /api/health {
            proxy_pass http://localhost:8000/api/health;
            access_log off;
        }
        
        # ============================================
        # 5. 静态文件直接访问（可选）
        # ============================================
        # 如果前端有静态文件需要直接访问，可以添加以下配置
        location /static/ {
            # 静态文件目录
            root /usr/share/nginx/html/xxdfq;
            
            # 缓存控制
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # ============================================
        # 6. 错误页面
        # ============================================
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # ============================================
        # 7. 安全配置
        # ============================================
        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # 禁止访问敏感文件
        location ~* \.(log|sql|bak|conf|ini|env|pyc|pyo)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    
    # ============================================
    # HTTPS配置（可选）
    # ============================================
    # server {
    #     listen 443 ssl http2;
    #     server_name xxdfq.local;
    #     
    #     # SSL证书
    #     ssl_certificate /etc/nginx/ssl/xxdfq.local.crt;
    #     ssl_certificate_key /etc/nginx/ssl/xxdfq.local.key;
    #     
    #     # SSL优化
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #     
    #     # 复制HTTP配置
    #     include /etc/nginx/sites-available/xxdfq-http.conf;
    # }
}
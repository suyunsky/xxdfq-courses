# xxdfq-courses Nginx配置
# 适用于小小达芬奇艺术教育平台
# 前端：Vue SPA应用（静态文件或开发服务器）
# 后端：FastAPI Python服务（8000端口）

server {
    listen 80;
    server_name xxdfq.local localhost 127.0.0.1;
    
    # 访问日志
    access_log /var/log/nginx/xxdfq-access.log;
    error_log /var/log/nginx/xxdfq-error.log;
    
    # 通用代理头
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # ============================================
    # 方案A：静态文件服务（推荐用于生产环境）
    # ============================================
    # 如果前端已经构建为静态文件，使用此配置
    location / {
        # 静态文件根目录
        root /usr/share/nginx/html/xxdfq;
        index index.html;
        
        # SPA路由支持 - 所有路由重定向到index.html
        try_files $uri $uri/ /index.html;
        
        # 缓存控制
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # 静态文件缓存（CSS、JS、图片等）
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html/xxdfq;
        
        # 长期缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ============================================
    # 方案B：开发服务器代理（用于开发环境）
    # ============================================
    # 如果前端还在开发服务器运行，取消注释以下配置
    # 并注释掉上面的静态文件配置
    #
    # location / {
    #     proxy_pass http://localhost:8080;
    #     
    #     # WebSocket支持
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     
    #     # 缓存控制
    #     proxy_set_header Cache-Control "no-cache";
    #     
    #     # 超时设置
    #     proxy_connect_timeout 60s;
    #     proxy_send_timeout 60s;
    #     proxy_read_timeout 60s;
    # }
    
    # ============================================
    # 后端API代理配置
    # ============================================
    location /api/ {
        proxy_pass http://localhost:8000;  # FastAPI后端运行在8000端口
        
        # CORS配置 - 允许前端来源
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, Cookie, Set-Cookie" always;
        add_header Access-Control-Expose-Headers "Set-Cookie, Content-Disposition" always;
        
        # 处理OPTIONS预检请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "$http_origin";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, Cookie, Set-Cookie";
            add_header Access-Control-Expose-Headers "Set-Cookie, Content-Disposition";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        
        # Cookie传递
        proxy_cookie_path / "/; SameSite=Lax; HttpOnly";
        proxy_cookie_domain localhost $host;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲区设置
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # ============================================
    # 腾讯云点播API代理（如果需要）
    # ============================================
    location /vod/ {
        proxy_pass http://localhost:8000/vod/;
        
        # 相同的CORS和代理配置
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # ============================================
    # 健康检查端点
    # ============================================
    location /health {
        access_log off;
        return 200 "xxdfq-courses Nginx is healthy\n";
        add_header Content-Type text/plain;
    }
    
    location /api/health {
        proxy_pass http://localhost:8000/api/health;
        access_log off;
    }
    
    # ============================================
    # 静态数据文件（JSON、配置文件等）
    # ============================================
    location /data/ {
        root /usr/share/nginx/html/xxdfq;
        
        # JSON文件缓存
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        
        # 安全头
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Type "application/json; charset=utf-8";
    }
    
    # ============================================
    # 字体文件特殊处理
    # ============================================
    location /fonts/ {
        root /usr/share/nginx/html/xxdfq/assets;
        
        # 字体文件缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        
        # 字体MIME类型
        types {
            font/woff2 woff2;
            font/woff woff;
            font/ttf ttf;
            font/eot eot;
            font/otf otf;
        }
    }
    
    # ============================================
    # 图片文件处理
    # ============================================
    location /assets/images/ {
        root /usr/share/nginx/html/xxdfq;
        
        # 图片缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # 图片优化
        image_filter resize 800 600;  # 可选：调整图片大小
        image_filter_jpeg_quality 85; # JPEG质量
    }
    
    # ============================================
    # 错误页面
    # ============================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    # ============================================
    # 安全配置
    # ============================================
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问敏感文件
    location ~* \.(log|sql|bak|conf|ini|env|pyc|pyo)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # ============================================
    # 性能优化
    # ============================================
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # 客户端缓存
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
}

